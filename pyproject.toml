[project]
name = "affine-cipher"
version = "0.1.0"
description = "A command-line affine cipher tool for encrypting and decrypting text, with case-preserving transforms and known-key or brute-force decryption."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Maria Campbell", email = "interglobalmedia@gmail.com" }
]
requires-python = ">=3.14.7"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "colorama>=0.4.6",
]

[project.scripts]
affine-cipher = "affine_cipher.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "types-colorama>=0.4.15.20260508",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true

# run command is:
# pytest --cov=affine_cipher --cov-report=term-missing
# and to make sure the latest test results render in the browser (not stale):
# pytest --cov=affine_cipher --cov-report=term-missing --cov-report=html

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
